<style>
:root{
  --bg:#101014; --fg:#f7f5f1; --muted:#f7f5f1a6; --line:#ffffff2e; --card:#ffffff12;
  --gold:#f1d9a0; --on-gold:#181818; --navh:60px; color-scheme:dark;
}
body.light{
  --bg:#f4f3f0; --fg:#25252b; --muted:#25252b99; --line:#25252b22; --card:#ffffff;
  --gold:#8c5a19; --on-gold:#ffffff; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Poppins,system-ui,sans-serif;transition:background .3s,color .3s;padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font-family:inherit;font-size:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* верхняя полоса WhatsApp */
.top-contacts{display:flex;justify-content:center;align-items:center;gap:10px;padding:10px;background:#151515;flex-wrap:wrap}
.top-contacts a{color:#fff;background:#25D366;padding:9px 16px;border-radius:25px;text-decoration:none;font-weight:600;font-size:13px;transition:.3s}
.top-contacts a:hover{transform:translateY(-2px);background:#1da851}

/* навигация */
nav{position:sticky;top:0;z-index:50;height:var(--navh);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 5%;background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.logo{font:700 22px 'Playfair Display',serif;letter-spacing:5px;cursor:pointer;user-select:none;background:none;border:0;color:inherit;padding:0}
.tools{display:flex;align-items:center;gap:8px}
.pill{color:inherit;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:9px 14px;cursor:pointer;transition:.2s;font-size:13px}
.pill:hover{border-color:var(--gold)}
select.pill{appearance:none;-webkit-appearance:none;padding-right:14px}
select.pill option{color:#fff;background:#222}

/* hero */
header.hero{position:relative;isolation:isolate;overflow:hidden;min-height:68vh;display:grid;place-items:center;text-align:center;padding:70px 20px;background:#1b1b21 center/cover no-repeat url("https://www.worldatlas.com/r/w1200/upload/8e/d2/38/shutterstock-549469321.jpg")}
header.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,#09090a66,#09090a55 50%,var(--bg))}
.hero h1{font:700 clamp(58px,14vw,112px) 'Playfair Display',serif;letter-spacing:.16em;margin:0;color:#fff;text-shadow:0 6px 30px #0009;animation:rise .9s ease both}
.hero p{letter-spacing:3px;text-transform:uppercase;font-size:13px;color:#fff;margin:14px 0 0;animation:rise .9s .15s ease both}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px;animation:rise .9s .3s ease both}
.cta{display:inline-block;color:#fff;text-decoration:none;border:1px solid #fff9;border-radius:50px;padding:13px 32px;background:#ffffff26;backdrop-filter:blur(12px);letter-spacing:2px;text-transform:uppercase;font-size:13px;transition:.3s}
.cta:hover{background:#fff;color:#111;transform:translateY(-3px)}

/* меню */
.toolbar{padding:46px 5% 10px;max-width:1200px;margin:0 auto}
h2{text-align:center;font:500 clamp(26px,5vw,38px) 'Playfair Display',serif;margin:0 0 26px}
.search-box{max-width:520px;margin:0 auto 20px}
.search-box input{width:100%;padding:14px 22px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:inherit;outline:none;transition:.3s}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 20px #d8bd8522}
.search-box input::placeholder{color:#999}
.filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.filter-btn{padding:9px 20px;border-radius:30px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;transition:.25s;font-size:13px}
.filter-btn.active,.filter-btn:hover{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}

.chips{position:sticky;top:var(--navh);z-index:40;display:flex;gap:8px;overflow-x:auto;padding:10px 5%;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;text-decoration:none;font-size:13px;padding:8px 14px;border-radius:30px;border:1px solid var(--line);white-space:nowrap;transition:.2s}
.chip.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}

.cat{max-width:1200px;margin:0 auto;padding:44px 5% 6px;scroll-margin-top:calc(var(--navh) + 56px)}
.cat h2{text-align:left;margin-bottom:18px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

.card{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 18px 18px 20px;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:0 8px 24px #0002;transition:.3s;animation:rise .45s ease both}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.card h3{font-size:14px;font-weight:400;margin:0;line-height:1.35;padding-right:6px}
.badge{display:inline-block;font-size:10px;color:var(--gold);letter-spacing:1px;margin-bottom:5px}
.favorite{position:absolute;top:6px;right:8px;border:0;background:transparent;color:#aaa;font-size:17px;cursor:pointer;padding:4px;transition:.2s}
.favorite.active{color:#ff647c}
.favorite.pop{animation:pop .5s ease}
.price-box{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:16px;flex:0 0 auto}
.vrow{display:flex;align-items:center;gap:8px}
.price{color:var(--gold);white-space:nowrap;font-weight:500;font-size:14px}
.empty{text-align:center;opacity:.6;padding:60px 10px}

.foot{text-align:center;color:var(--muted);padding:30px 20px calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:40px;font-size:13px}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.7) rotate(-10deg)}100%{transform:scale(1)}}

@media(max-width:600px){
  nav{padding:0 4%}
  .logo{font-size:19px;letter-spacing:4px}
  .pill{padding:8px 11px}
  .menu{grid-template-columns:1fr;gap:10px}
  .card{padding:16px 14px 16px 16px}
  .top-contacts a{flex:1 1 150px;text-align:center;font-size:12px;padding:9px 8px}
  header.hero{min-height:56vh}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

        const translations = {

        /* Блюда с пометкой «Наши собственные» — впиши сюда названия как в меню (по-азербайджански) */
        const popular = [

const catEmoji = ['🥗','🍲','🥩','🍗','🍝','🍔','🥬','🐟','🍚','🍳','🍺','🍷','☕','🫖','🥤','🍰'];

const $ = id => document.getElementById(id);
const root = $('content'), chips = $('chips'), lang = $('language'), search = $('search');

const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

const items = [];
cats.forEach((arr, ci) => arr.forEach(([name, price]) => {
    items.push({
        id: items.length, name, cat: ci,
        prices: typeof price === 'number' ? [price] : String(price).split('/').map(Number)
    });
}));

let filter = 'all', lastPop = null;
let favorites = [];
try { favorites = JSON.parse(store.get('ohio-favorites', '[]')); } catch (e) {}

const T = () => words[lang.value];
const fmt = n => Number(n).toFixed(2);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

function getName(name) {
    const l = lang.value;
    if (l === 'az') return name;
    return translations[l][name] || name;
}

function matches(it, query) {
    if (query && !(it.name + ' ' + getName(it.name)).toLowerCase().includes(query)) return false;
    if (filter === 'favorites' && !favorites.includes(it.name)) return false;
    if (filter === 'popular' && !popular.includes(it.name)) return false;
    return true;
}

function cardHTML(it, t) {
    const fav = favorites.includes(it.name);
    const pop = popular.includes(it.name);
    const multi = it.prices.length > 1;
    const labels = [`🥩 ${t.meat}`, `🍗 ${t.chicken}`];
    const title = multi
        ? getName(it.name).replace(/\s*\([^)]*\/[^)]*\)/, '')
        : getName(it.name);

    const prices = it.prices.map((p, v) =>
        `<span class="price">${multi ? labels[v] + ' · ' : ''}${fmt(p)} ₼</span>`).join('');

    return `
        <article class="card">
            <button class="favorite ${fav ? 'active' : ''}" data-id="${it.id}" aria-label="Favorite">${fav ? '♥' : '♡'}</button>
            <div>
                ${pop ? `<span class="badge">★ ${t.ownBadge}</span>` : ''}
                <h3>${esc(title)}</h3>
            </div>
            <div class="price-box">${prices}</div>
        </article>`;
}

function render() {
    const t = T();
    const query = search.value.toLowerCase().trim();
    document.documentElement.lang = lang.value;

    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
    search.placeholder = t.search;

    const groups = cats.map((_, ci) => items.filter(it => it.cat === ci && matches(it, query)));

    chips.innerHTML = groups.map((g, ci) => g.length
        ? `<a class="chip" href="#cat-${ci}" data-cat="${ci}">${catEmoji[ci]} ${t.categories[ci]}</a>` : '').join('');

    root.innerHTML = groups.map((g, ci) => g.length ? `
        <section class="cat" id="cat-${ci}">
            <h2>${catEmoji[ci]} ${t.categories[ci]}</h2>
            <div class="menu">${g.map(it => cardHTML(it, t)).join('')}</div>
        </section>` : '').join('')
        || `<div class="empty">${filter === 'favorites' && !query ? t.empty : t.noResults}</div>`;

    if (lastPop !== null) {
        root.querySelectorAll('.favorite').forEach(b => { if (+b.dataset.id === lastPop) b.classList.add('pop'); });
        lastPop = null;
    }
    spy();
}

root.addEventListener('click', e => {
    const fav = e.target.closest('.favorite');
    if (!fav) return;
    const it = items[fav.dataset.id];
    if (favorites.includes(it.name)) favorites = favorites.filter(n => n !== it.name);
    else { favorites.push(it.name); lastPop = it.id; }
    store.set('ohio-favorites', JSON.stringify(favorites));
    render();
});

/* подсветка активной категории */
let spyTick = false;
function spy() {
    let active = null;
    document.querySelectorAll('.cat').forEach(s => { if (s.getBoundingClientRect().top <= 130) active = s.id.replace('cat-', ''); });
    chips.querySelectorAll('.chip').forEach(c => {
        const on = c.dataset.cat === active;
        if (on && !c.classList.contains('on')) {
            chips.scrollTo({ left: c.offsetLeft - chips.clientWidth / 2 + c.clientWidth / 2, behavior: 'smooth' });
        }
        c.classList.toggle('on', on);
    });
}
window.addEventListener('scroll', () => {
    if (spyTick) return;
    spyTick = true;
    requestAnimationFrame(() => { spy(); spyTick = false; });
}, { passive: true });

/* язык, тема, фильтры */
lang.value = store.get('ohio-language', 'ru');
if (!words[lang.value]) lang.value = 'ru';
lang.addEventListener('change', () => { store.set('ohio-language', lang.value); updateTheme(); render(); });

search.addEventListener('input', render);

document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    render();
}));

function updateTheme() {
    const light = document.body.classList.contains('light');
    $('theme').textContent = T().toggle + ': ' + (light ? '☼' : '☾');
    document.querySelector('meta[name=theme-color]').content = light ? '#f4f3f0' : '#101014';
}
function setTheme(light) {
    document.body.classList.toggle('light', light);
    store.set('ohio-theme', light ? 'light' : 'dark');
    updateTheme();
}
setTheme(store.get('ohio-theme', 'dark') === 'light');
$('theme').addEventListener('click', () => setTheme(!document.body.classList.contains('light')));
$('logo').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

render();
